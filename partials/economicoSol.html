<h2 class="section-title">Tasas de Aprobación</h2>

<!-- Fila 1: Distribución de Estatus · Tasa por Nivel · Tasa por Sector -->
<div class="charts-grid cols-3">
    <div class="chart-card">
        <div id="chart-estatus-dist" class="chart-container"></div>
    </div>
    <div class="chart-card">
        <div id="chart-tasa-nivel" class="chart-container"></div>
    </div>
    <div class="chart-card">
        <div id="chart-tasa-sector" class="chart-container"></div>
    </div>
</div>

<!-- Fila 2: Tasa de Rechazo por Tipo de Beca con semáforo (ancho completo) -->
<div class="charts-grid cols-1">
    <div class="chart-card">
        <div id="chart-tasa-tipo" class="chart-container chart-xl"></div>
    </div>
</div>

<!-- Fila 3: Top CURPs con más rechazos (ancho completo) -->
<div class="charts-grid cols-1">
    <div class="chart-card">
        <div id="chart-top-rechazos-curp" class="chart-container chart-xxl"></div>
    </div>
</div>

<!-- Fila 4: Tasa por Etapa · Brecha de Género · Riesgo de Abandono -->
<div class="charts-grid cols-3">
    <div class="chart-card">
        <div id="chart-tasa-etapa" class="chart-container"></div>
    </div>
    <div class="chart-card">
        <div id="chart-tasa-genero" class="chart-container"></div>
    </div>
    <div class="chart-card">
        <div id="chart-riesgo-abandono" class="chart-container"></div>
    </div>
