<h2 class="section-title">Territorial</h2>

<!-- ── 1. Beneficiarios por Delegación ──────────────────────────────────── -->
<div class="charts-grid cols-1">
    <div class="chart-card">
        <div class="view-toggle">
            <button class="vt-btn active" data-view="top">Top</button>
            <button class="vt-btn" data-view="comparativa">Comparativa</button>
            <select class="top-select" id="del-barras-top-n" style="margin-left:6px">
                <option value="5">Top 5</option>
                <option value="10">Top 10</option>
                <option value="15" selected>Top 15</option>
            </select>
        </div>
        <div id="chart-delegacion-barras" class="chart-container chart-xl"></div>
    </div>
</div>

<!-- Modal: Delegaciones (barras) -->
<div id="modal-del-barras" class="rng-modal-overlay" hidden>
    <div class="rng-modal">
        <div class="rng-modal-header">
            <span class="rng-modal-title">Seleccionar Delegaciones</span>
            <button class="rng-modal-close">×</button>
        </div>
        <div class="rng-modal-actions">
            <button class="rng-action-btn" data-action="all">Seleccionar todos</button>
            <button class="rng-action-btn" data-action="none">Limpiar selección</button>
        </div>
        <div class="rng-modal-checks" id="modal-del-barras-checks"></div>
        <div class="rng-modal-footer">
            <button class="rng-footer-btn rng-cancel-btn">Cancelar</button>
            <button class="rng-footer-btn rng-apply-btn" data-apply="del-barras">Aplicar</button>
        </div>
    </div>
</div>

            <button class="vt-btn" data-view="comparativa">Comparativa</button>

                <option value="5">Top 5</option>
                <option value="10">Top 10</option>
                <option value="15" selected>Top 15</option>
            </select>
        </div>
        <div id="chart-delegacion-treemap" class="chart-container chart-xl"></div>

</div>

<!-- Modal: Delegaciones (treemap) -->
<div id="modal-del-treemap" class="rng-modal-overlay" hidden>

        <div class="rng-modal-header">
            <span class="rng-modal-title">Seleccionar Delegaciones</span>
            <button class="rng-modal-close">×</button>

        <div class="rng-modal-actions">

            <button class="rng-footer-btn rng-apply-btn" data-apply="del-treemap">Aplicar</button>
        </div>
    </div>
</div>

<!-- ── 3. Top Colonias por Beneficiarios (burbujas) ──────────────────────── -->
<div class="charts-grid cols-1">
    <div class="chart-card">
        <div class="view-toggle">
            <button class="vt-btn active" data-view="top">Top</button>
            <button class="vt-btn" data-view="comparativa">Comparativa</button>
            <select class="top-select" id="col-top-n" style="margin-left:6px">
                <option value="5">Top 5</option>
                <option value="10">Top 10</option>
                <option value="15" selected>Top 15</option>
            </select>
        </div>
        <div id="chart-top15-colonias" class="chart-container chart-xxl"></div>
    </div>
</div>

<!-- Modal: Colonias (burbujas) -->
<div id="modal-colonias-terr" class="rng-modal-overlay" hidden>
    <div class="rng-modal">
        <div class="rng-modal-header">
            <span class="rng-modal-title">Seleccionar Colonias</span>
            <button class="rng-modal-close">×</button>
        </div>
        <div class="rng-modal-actions">
            <button class="rng-action-btn" data-action="all">Seleccionar todos</button>
            <button class="rng-action-btn" data-action="none">Limpiar selección</button>
        </div>
        <div style="padding: 0 18px 6px;">
            <input type="text" class="rng-search-input" placeholder="Buscar colonia...">
        </div>
        <div class="rng-modal-checks" id="modal-colonias-terr-checks"></div>
        <div class="rng-modal-footer">
            <button class="rng-footer-btn rng-cancel-btn">Cancelar</button>

        </div>
    </div>
</div>

<!-- ── 4. Mapa de Beneficiarios por Territorio ───────────────────────────── -->
<div class="charts-grid cols-1">
    <div class="chart-card" style="position:relative;">
        <div id="mapa-tipo-toggle" class="view-toggle">
            <button class="vt-btn active" data-territorio="colonias">Colonias</button>
            <button class="vt-btn" data-territorio="delegaciones">Delegaciones</button>
        </div>
        <div id="mapa-topcomp-toggle" class="view-toggle" style="margin-top:4px;">
            <button class="vt-btn active" data-view="top">Top</button>
            <button class="vt-btn" data-view="comparativa">Comparativa</button>
            <select class="top-select" id="mapa-top-n" style="margin-left:6px">
                <option value="5">Top 5</option>
                <option value="10">Top 10</option>
                <option value="15" selected>Top 15</option>
            </select>
        </div>
        <div style="position:relative;">
            <div id="chart-mapa-colonias" class="chart-container chart-xxl"></div>
            <div style="position:absolute;top:70px;right:130px;z-index:500;display:flex;flex-direction:column;gap:4px;">
                <button id="mapa-zoom-in"    class="vt-btn" title="Acercar">＋</button>
                <button id="mapa-zoom-out"   class="vt-btn" title="Alejar">－</button>
                <button id="mapa-fullscreen" class="vt-btn" title="Pantalla completa">⛶</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Territorios del mapa -->
<div id="modal-mapa-terr" class="rng-modal-overlay" hidden>
    <div class="rng-modal">
        <div class="rng-modal-header">
            <span class="rng-modal-title" id="modal-mapa-terr-title">Seleccionar Territorios</span>
            <button class="rng-modal-close">×</button>
        </div>
        <div class="rng-modal-actions">
            <button class="rng-action-btn" data-action="all">Seleccionar todos</button>
            <button class="rng-action-btn" data-action="none">Limpiar selección</button>
        </div>
        <div style="padding: 0 18px 6px;">
            <input type="text" class="rng-search-input" placeholder="Buscar...">
        </div>
        <div class="rng-modal-checks" id="modal-mapa-terr-checks"></div>
        <div class="rng-modal-footer">
            <button class="rng-footer-btn rng-cancel-btn">Cancelar</button>
            <button class="rng-footer-btn rng-apply-btn" data-apply="mapa-terr">Aplicar</button>
        </div>
    </div>
</div>

<!-- ── Análisis de Proximidad — OCULTO ──────────────────────────────────── -->

    <h3 class="section-subtitle">Análisis de Proximidad</h3>

    <div class="charts-grid cols-2">

                    <option value="5">Top 5</option>
                    <option value="10">Top 10</option>
                    <option value="15" selected>Top 15</option>

            <div id="chart-proximidad-delegacion" class="chart-container chart-xl"></div>
        </div>
        <div class="chart-card">
            <div id="chart-proximidad-scatter" class="chart-container chart-xl"></div>
        </div>
    </div>
</div>
