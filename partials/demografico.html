<h2 class="section-title">Demográfico</h2>

<!-- Fila 1: Género · Paridad · Género×Sector -->
<div class="charts-grid cols-3">
    <div class="chart-card">
        <div id="chart-genero" class="chart-container"></div>
    </div>
    <div class="chart-card">
        <div id="chart-paridad" class="chart-container"></div>
    </div>
    <div class="chart-card">
        <div id="chart-genero-sector" class="chart-container"></div>
    </div>
</div>

<!-- Fila 2: Pirámide de Edades · Edad Promedio por Nivel -->
<div class="charts-grid cols-2">
    <div class="chart-card">
        <div id="chart-piramide" class="chart-container chart-tall"></div>
    </div>
    <div class="chart-card">
        <div id="chart-edad-nivel" class="chart-container chart-tall"></div>
    </div>
</div>

<!-- Fila 3: Índice de Rezago (ancho completo) -->
<div class="charts-grid cols-1">
    <div class="chart-card">
        <div id="chart-rezago" class="chart-container"></div>
    </div>
</div>

<!-- Fila 4: Top CURPs con más becas (ancho completo) -->
<div class="charts-grid cols-1">
    <div class="chart-card">
        <div class="top-selector" data-chart="chart-top-curps">
            <span class="top-selector-label">Mostrar:</span>
            <select class="top-select">
                <option value="5">Top 5</option>
                <option value="10">Top 10</option>
                <option value="15" selected>Top 15</option>
            </select>
        </div>
        <div id="chart-top-curps" class="chart-container chart-tall"></div>
    </div>
</div>
