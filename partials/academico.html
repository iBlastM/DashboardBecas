<h2 class="section-title">Académico</h2>

<!-- Fila 1: Becas por Nivel · Penetración Sector · Beneficiarios por Grado -->
<div class="charts-grid cols-3">
    <div class="chart-card">
        <div id="chart-becas-nivel" class="chart-container"></div>
    </div>
    <div class="chart-card">
        <div id="chart-penetracion-sector" class="chart-container"></div>
    </div>
    <div class="chart-card">
        <div id="chart-grado" class="chart-container"></div>
    </div>
</div>

<!-- Fila 2: Diversidad Escolar por Sector · por Colonia -->
<div class="charts-grid cols-2">
    <div class="chart-card">
        <div id="chart-diversidad-sector" class="chart-container chart-tall"></div>
    </div>
    <div class="chart-card">
        <div class="top-selector" data-chart="chart-diversidad-colonia">
            <span class="top-selector-label">Mostrar:</span>
            <select class="top-select">
                <option value="5">Top 5</option>
                <option value="10">Top 10</option>
                <option value="15" selected>Top 15</option>
            </select>
        </div>
        <div id="chart-diversidad-colonia" class="chart-container chart-tall"></div>
    </div>
</div>

<!-- Fila 3: Top Escuelas (ancho completo) -->
<div class="charts-grid cols-1">
    <div class="chart-card">
        <div class="top-selector" data-chart="chart-top-escuelas">
            <span class="top-selector-label">Mostrar:</span>
            <select class="top-select">
                <option value="5">Top 5</option>
                <option value="10">Top 10</option>
                <option value="15" selected>Top 15</option>
            </select>
        </div>
        <div id="chart-top-escuelas" class="chart-container chart-xxl"></div>
    </div>
</div>
