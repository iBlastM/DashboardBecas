<h2 class="section-title">Familiar</h2>

<!-- Fila 1: Género Tutor · Edad Tutor/Nivel · Edad Tutor/Sector -->
<div class="charts-grid cols-3">
    <div class="chart-card">
        <div id="chart-genero-tutor" class="chart-container"></div>
    </div>
    <div class="chart-card">
        <div id="chart-edad-tutor-nivel" class="chart-container"></div>
    </div>
    <div class="chart-card">
        <div id="chart-edad-tutor-sector" class="chart-container"></div>
    </div>
</div>

<!-- Fila 2: Rangos de Edades Tutor · Brecha Generacional -->
<div class="charts-grid cols-2">
    <div class="chart-card">
        <div id="chart-edad-tutor-rangos" class="chart-container chart-tall"></div>
    </div>
    <div class="chart-card">
        <div id="chart-brecha-generacional" class="chart-container chart-tall"></div>
    </div>
</div>

<!-- Fila 3: Índice de Jefatura Femenina Estimada (ancho completo) -->
<div class="charts-grid cols-1">
    <div class="chart-card">
        <div class="top-selector" data-chart="chart-jefatura-femenina">
            <span class="top-selector-label">Mostrar:</span>
            <select class="top-select">
                <option value="5">Top 5</option>
                <option value="10">Top 10</option>
                <option value="15" selected>Top 15</option>
            </select>
        </div>
        <div id="chart-jefatura-femenina" class="chart-container chart-xxl"></div>
    </div>
</div>
