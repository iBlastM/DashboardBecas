<h2 class="section-title">Electoral</h2>

<!-- Distrito Local y Distrito Federal — lado a lado -->
<div class="charts-grid cols-2">
    <div class="chart-card">
        <div id="chart-distrito-local-pie" class="chart-container chart-lg"></div>
    </div>
    <div class="chart-card">
        <div id="chart-distrito-federal-pie" class="chart-container chart-lg"></div>
    </div>
</div>

<!-- Barras comparativas de inversión por distrito -->
<div class="charts-grid cols-2">
    <div class="chart-card">
        <div id="chart-distrito-local-inversion" class="chart-container chart-lg"></div>
    </div>
    <div class="chart-card">
        <div id="chart-distrito-federal-inversion" class="chart-container chart-lg"></div>
    </div>
</div>

<!-- Top Secciones Electorales por Beneficiarios -->
<div class="charts-grid cols-1">
    <div class="chart-card">
        <div class="top-selector" data-chart="chart-top-secciones">
            <span class="top-selector-label">Mostrar:</span>
            <button class="top-btn" data-n="5">Top 5</button>
            <button class="top-btn" data-n="10">Top 10</button>
            <button class="top-btn active" data-n="15">Top 15</button>
        </div>
        <div id="chart-top-secciones" class="chart-container chart-xxl"></div>
    </div>
</div>

<!-- Inversión por Sección Electoral -->
<div class="charts-grid cols-1">
    <div class="chart-card">
        <div class="top-selector" data-chart="chart-seccion-inversion">
            <span class="top-selector-label">Mostrar:</span>
            <button class="top-btn" data-n="5">Top 5</button>
            <button class="top-btn" data-n="10">Top 10</button>
            <button class="top-btn active" data-n="15">Top 15</button>
        </div>
        <div id="chart-seccion-inversion" class="chart-container chart-xl"></div>
    </div>
</div>
